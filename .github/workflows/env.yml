name: Set Environment Variables

on:
  workflow_dispatch:

jobs:
  set-env:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set Environment Variables
        run: |
          echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV
          echo "STABILITY_API_KEY=${{ secrets.STABILITY_API_KEY }}" >> $GITHUB_ENV
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> $GITHUB_ENV
          echo "ELEVENLABS_API_KEY=${{ secrets.ELEVENLABS_API_KEY }}" >> $GITHUB_ENV
          echo "IA_STUDIO_API_KEY=${{ secrets.IA_STUDIO_API_KEY }}" >> $GITHUB_ENV
          echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" >> $GITHUB_ENV
      
      - name: Show Environment Variables
        run: |
          echo "Environment Variables Set:"
          echo "GITHUB_TOKEN: ${GITHUB_TOKEN}"
          echo "STABILITY_API_KEY: ${STABILITY_API_KEY}"
          echo "OPENAI_API_KEY: ${OPENAI_API_KEY}"
          echo "ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}"
          echo "IA_STUDIO_API_KEY: ${IA_STUDIO_API_KEY}"
          echo "DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}"
