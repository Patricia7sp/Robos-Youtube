name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  terraform:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.0.0
      
      - name: Initialize Terraform
        run: |
          cd terraform
          terraform init
      
      - name: Validate Terraform
        run: |
          cd terraform
          terraform validate
      
      - name: Plan Terraform
        run: |
          cd terraform
          terraform plan -out=tfplan
      
      - name: Apply Terraform
        if: github.ref == 'refs/heads/main'
        run: |
          cd terraform
          terraform apply -auto-approve tfplan
      
      - name: Run Tests
        run: |
          # Aqui você pode adicionar testes específicos do seu projeto
          echo "Running tests..."
      
      - name: Build and Deploy
        if: github.ref == 'refs/heads/main'
        run: |
          # Aqui você pode adicionar os comandos de build e deploy do seu projeto
          echo "Building and deploying..."
      
      - name: Cleanup
        run: |
          cd terraform
          terraform destroy -auto-approve

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ --cov=modern_system --cov-report=xml:coverage.xml
          
      - name: Run integration tests
        run: |
          python -m pytest tests/integration/
          
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          
  code-quality:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint bandit black mypy
          
      - name: Run linting
        run: |
          pylint modern_system/
          
      - name: Run security analysis
        run: |
          bandit -r modern_system/ -c .bandit.yml
          
      - name: Run type checking
        run: |
          mypy modern_system/
          
      - name: Run code formatting check
        run: |
          black --check modern_system/
          
      - name: Run SonarQube analysis
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          
  deploy:
    runs-on: ubuntu-latest
    needs: [test, code-quality]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run deployment
        run: |
          python deploy.py
          
      - name: Clean up
        run: |
          rm -rf __pycache__
          find . -name "*.pyc" -delete
          
  release:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      
      - name: Create release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.sha }}
          release_name: Release ${{ github.sha }}
          body: |
            Changes in this release:
            ${{ github.event.pull_request.body }}
          draft: false
          prerelease: false
          
      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/
          asset_name: release-${{ github.sha }}.zip
          asset_content_type: application/zip
